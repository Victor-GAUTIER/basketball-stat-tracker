name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"

          if ((Get-Item "ffmpeg.zip").Length -lt 1000000) {
            Write-Error "FFmpeg archive is unexpectedly small."
            exit 1
          }

          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force

          New-Item -ItemType Directory -Force -Path "bin"

          $exe = Get-ChildItem `
            -Path "ffmpeg_extracted" `
            -Recurse `
            -Filter "ffmpeg.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "ffmpeg.exe not found in the downloaded archive."
            exit 1
          }

          Copy-Item $exe.FullName -Destination "bin\ffmpeg.exe"

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "BasketballStatTracker" --windowed --onefile --add-data "assets;assets" --add-binary "bin\ffmpeg.exe;bin" --collect-all matplotlib main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/BasketballStatTracker.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip
          mkdir -p bin ffmpeg_extracted
          unzip ffmpeg.zip -d ffmpeg_extracted
          cp ffmpeg_extracted/ffmpeg bin/ffmpeg
          chmod +x bin/ffmpeg

      - name: Build with PyInstaller
        run: |
          pyinstaller --name "BasketballStatTracker" --windowed --onefile --add-data "assets:assets" --add-binary "bin/ffmpeg:bin" main.py

      - name: Zip .app
        run: |
          cd dist
          zip -r BasketballStatTracker-macOS.zip BasketballStatTracker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/BasketballStatTracker-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
